name: PR48 pacing reconcile

on:
  push:
    branches:
      - audit/content-campaign-c04-20260821

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: audit/content-campaign-c04-20260821
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile learner-facing pacing totals
        run: python3 scripts/reconcile_pr48_pacing.py
      - name: Commit deterministic reconciliation
        run: |
          if git diff --quiet -- src/lib/course/sections; then
            echo 'Pacing copy already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/course/sections
          git commit -m 'fix: reconcile learner-facing pacing totals'
          git push origin HEAD:audit/content-campaign-c04-20260821
