name = "pyarcana-billing"
main = "src/index.mjs"
compatibility_date = "2025-09-01"
# One origin only (DESIGN-v3 §A): no *.workers.dev URL and no preview URLs, so the site, its
# cookie and its CORS answer exist on pyarcana.dev alone. Bind no other host: static files are
# served before the worker runs, so www bound here served the whole course with accounts silently
# off. www.pyarcana.dev and pyarcana.com are zone Redirect Rules instead (README, setup step 5),
# which cost no worker request.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "pyarcana.dev", custom_domain = true },
]

# --- One origin: the static site and the API from this worker (DESIGN-v3 §A) ----------
# The Next.js static export (`NEXT_PUBLIC_BASE_PATH= bun run build:static`, repository
# root) is served as Workers Static Assets. Only /api/* runs the worker first; every other
# path is a file, and a missing file gets out/404.html with status 404. src/index.mjs also
# hands any non-API path to ASSETS if the platform routes one to the worker.
[assets]
directory = "../../out"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

# --- D1 (accounts, sessions, progress, grants, billing ledger, reports) ---------------
# scripts/setup.sh finds or creates it and writes its id into your LOCAL copy of this file;
# keep the placeholder in git (scripts/deploy.sh refuses to deploy while a placeholder remains).
# By hand: npx wrangler d1 create pyarcana-accounts, then paste the id it prints.
# The schema is applied by the worker itself (numbered migrations in src/schema.mjs).
[[d1_databases]]
binding = "DB"
database_name = "pyarcana-accounts"
database_id = "TODO_REPLACE_WITH_D1_DATABASE_ID"

# --- Public configuration (committed; safe to publish) --------------------------------
# Empty values fail closed: with no ALLOWED_ORIGINS every state-changing request is
# refused (403 bad_origin), and with no TERMS_VERSION sign-in answers 503.
# Local development overrides these in workers/billing/.dev.vars (git-ignored).
[vars]
# Exact origins allowed to call the API with credentials, comma-separated, no trailing
# slash. Accounts run only on PyArcana's own domain, never on the shared pillb.github.io.
# Production is one origin (DESIGN-v3 §K); local dev adds http://localhost:3000 in .dev.vars.
ALLOWED_ORIGINS = "https://pyarcana.dev"
# The canonical site origin and the site base path ("" = served at the root).
CANONICAL_ORIGIN = "https://pyarcana.dev"
SITE_PATH = ""
# Version string of the Terms the sign-in panel shows; sign-in must echo it exactly.
TERMS_VERSION = "2026-10-05"
# The named holder of the personal-data bank (Ley 29733 art. 18): the legal entity being formed.
# Empty = sign-up closed: only ADMIN_EMAILS may create an account; existing accounts sign in as
# usual. Must equal the site's CLOUD_CONFIG.legal.sellerName (pinned by a test).
CONTROLLER_NAME = ""
# Trial length (days), grace after a failed renewal (days), absolute session cap (days).
TRIAL_DAYS = "7"
GRACE_DAYS = "7"
SESSION_MAX_DAYS = "180"
# OAuth client ids are public by design (they ship in the page). Use PyArcana's OWN ids:
# a token minted for any other app is refused by audience.
GOOGLE_CLIENT_ID = "432743649609-a450e9saoe4akd98dt3gsnous80vblj4.apps.googleusercontent.com"
# Microsoft uses the `common` authority (D-USER-05: any Entra ID tenant + personal
# accounts). The authority is the client's setting (microsoftAuthority); the worker always
# verifies against the common JWKS and the token's own tenant issuer.
MICROSOFT_CLIENT_ID = "171fb4ff-f112-46b2-9043-92ecb97f56fe"
# Sign-in code email: "" = OFF. The beta starts on Workers Free with Google and Microsoft
# sign-in only (owner decision, 1 Oct 2026); the sign-in panel then hides the email option.
# To turn codes on: cloudflare (Workers Paid + the send_email block below, D-USER-04) |
# resend | brevo | mailersend (dev-log only for localhost E2E).
EMAIL_PROVIDER = ""
# A role address on PyArcana's domain, never a personal mailbox. With cloudflare it must be
# an allowed sender of the EMAIL binding and a verified Email Sending identity.
EMAIL_FROM = "no-reply@pyarcana.dev"
EMAIL_FROM_NAME = "PyArcana"
# Global emails per UTC day; keep it under the provider's free quota. One network
# (IPv4 address or IPv6 /64) may use at most a ninth of it per day.
EMAIL_DAILY_CAP = "90"
# Ceiling (MiB) on bug-report screenshots stored in D1, all reports together. Keep it
# well under the database limit (D1 Free: 500 MB) so screenshots can never fill the
# database that sign-in and progress need. Above it, report text is still stored.
REPORT_ATTACHMENTS_CAP_MB = "200"
# Ceiling (MiB) on bug-report TEXT stored in D1, all reports together (UTF-8 bytes plus a
# fixed row overhead per report). With the screenshot ceiling it keeps reports under ~315 MB
# of D1 Free's 500 MB. Above it new reports are refused (507) until old ones are deleted.
REPORT_TEXT_CAP_MB = "100"
# Prices in integer minor units (céntimos / cents). New prices apply to new checkouts only.
# Mercado Pago bills PRICE_PE_* in PEN; Creem bills PRICE_US_* in USD, and the Creem products'
# prices must equal these (a webhook with another price is ignored). They must also equal
# src/lib/cloud/offer.ts (tests/money.test.mjs checks it).
PRICE_PE_MONTHLY_MINOR = "1990"
PRICE_PE_YEARLY_MINOR = "11990"
PRICE_US_MONTHLY_MINOR = "799"
PRICE_US_YEARLY_MINOR = "4900"
# Creem: https://api.creem.io (live) or https://test-api.creem.io (test mode). Product ids are
# public (they appear in checkout URLs).
CREEM_API_BASE = "https://api.creem.io"
CREEM_PRODUCT_PRO_MONTHLY = ""
CREEM_PRODUCT_PRO_YEARLY = ""
MP_API_BASE = "https://api.mercadopago.com"
# Licence token (DESIGN-v3-delta D-ORCH-03): the ES256 key id in every token header and in
# GET /v1/jwks; set it to the kid you passed to scripts/generate-keys.mjs. Tokens live at most
# LICENSE_TTL_SECONDS (clamped to 60..259200: the browser refuses anything over 72 h). During a
# key rotation, LICENSE_PREV_PUBLIC_JWK holds the OLD public JWK (one line of JSON, public only)
# so GET /v1/jwks lists both until the old tokens have expired.
LICENSE_KEY_ID = "k1"
LICENSE_TTL_SECONDS = "259200"
LICENSE_PREV_PUBLIC_JWK = ""
# Experiments (DESIGN-v3 §F): comma list of registry keys to run (aa_2026_q4, pkg_ab_v1,
# ads_house_v1; see src/experiments.mjs). Empty: nothing runs, GET /v1/experiments is empty.
EXPERIMENTS_ENABLED = ""
# Anonymous events (POST /v1/events): "false" is the kill switch (answers 202, stores nothing).
EVENTS_ENABLED = "true"

# --- Cloudflare Email Sending (D-USER-04) -------------------------------------------
# Sign-in codes are sent with env.EMAIL.send(). Needs Workers Paid (3,000 messages a month
# included) and pyarcana.dev onboarded to Email Sending (its records live on the cf-bounce
# subdomain, so Hostinger's MX/SPF/DKIM stay as they are). The binding may send only from
# the address below, which must equal EMAIL_FROM.
# OFF while the account is on Workers Free (owner decision, 1 Oct 2026): Email Sending needs
# Workers Paid, and a binding is not deployed until it can work. To turn it on, uncomment the
# three lines below and set EMAIL_PROVIDER = "cloudflare" above, then deploy.
# [[send_email]]
# name = "EMAIL"
# allowed_sender_addresses = ["no-reply@pyarcana.dev"]

# --- Secrets (NEVER put values in this file; it is public) ----------------------------
# scripts/setup.sh sets SERVER_PEPPER, ADMIN_EMAILS and LICENSE_PRIVATE_KEY_PKCS8_B64 (piped,
# never printed). The rest, or all of them by hand, with wrangler from workers/billing/:
#   npx wrangler secret put SERVER_PEPPER          32+ random bytes, base64:
#                                                  openssl rand -base64 32
#   npx wrangler secret put ADMIN_EMAILS           comma-separated admin addresses
#                                                  (admin also needs a Google session < 12 h)
# Only the one named in EMAIL_PROVIDER (cloudflare needs none):
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put BREVO_API_KEY
#   npx wrangler secret put MAILERSEND_API_KEY
# Payments (a rail is offered only when its key, its webhook secret, its PRICE_* vars and,
# for Creem, both product ids are set; webhooks: https://pyarcana.dev/api/v1/webhooks/...):
#   npx wrangler secret put MP_ACCESS_TOKEN        Mercado Pago "Tus integraciones" access token
#   npx wrangler secret put MP_WEBHOOK_SECRET      the webhook "secret signature"
#   npx wrangler secret put CREEM_API_KEY
#   npx wrangler secret put CREEM_WEBHOOK_SECRET   the whole whsec_... string
# Licence signing key (without it /v1/me sends licenseToken null and GET /v1/jwks is 503):
#   node scripts/generate-keys.mjs k1              prints the key and the public JWK
#   npx wrangler secret put LICENSE_PRIVATE_KEY_PKCS8_B64   paste the key at the prompt

# Daily at 09:17 UTC (04:17 Lima): retention sweep, then reconciliation of every live
# subscription. Hourly at :07: reconciliation of recent checkouts and pending subscriptions
# (src/retention.mjs, src/reconcile.mjs; 50 rows per set per run).
[triggers]
crons = ["17 9 * * *", "7 * * * *"]

[observability]
enabled = true
